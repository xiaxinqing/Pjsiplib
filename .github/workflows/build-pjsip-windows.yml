name: Build PJSIP Windows x64

env:
  OPENSSL_VERSION: 3.5.7
  OPENSSL_SHA256: a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-pjsip-windows.yml"
      - "tool/windows_pjsip/**"
      - "third_path/pjproject/**"

jobs:
  build-windows:
    # 使用 Windows Server 2022 + Visual Studio 2022
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          # Visual Studio 2022
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64

      - name: Verify Windows build tools
        shell: pwsh
        run: |
          # CMake 的 VS 生成器依赖已注册的完整 Visual Studio 实例，只有
          # PATH 中存在 MSBuild 并不足够。提前检查可以给出更明确的错误。
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) {
            throw 'vswhere.exe was not found; Visual Studio Installer is unavailable'
          }

          $installationPath = & $vswhere `
            -latest `
            -version '[17.0,18.0)' `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (!$installationPath) {
            throw 'Visual Studio 2022 with the MSVC x64 build tools was not found'
          }
          Write-Host “Using Visual Studio 2022: $installationPath”

          # Visual Studio 2022 使用 CMake 3.14+
          cmake --version

      - name: Build pinned OpenSSL LTS
        shell: pwsh
        run: |
          $archive = "${{ github.workspace }}/openssl-$env:OPENSSL_VERSION.tar.gz"
          $sourceUrl = "https://www.openssl.org/source/openssl-$env:OPENSSL_VERSION.tar.gz"
          Invoke-WebRequest -Uri $sourceUrl -OutFile $archive
          $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:OPENSSL_SHA256) {
            throw "OpenSSL source checksum mismatch: expected $env:OPENSSL_SHA256, got $actualHash"
          }
          tar -xzf $archive -C '${{ github.workspace }}'

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -version '[17.0,18.0)' -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vsPath) { throw 'Unable to locate Visual Studio 2022' }

          $source = "${{ github.workspace }}\openssl-$env:OPENSSL_VERSION"
          $prefix = "${{ github.workspace }}\deps\openssl"
          $batchFile = "${{ github.workspace }}\build-openssl.cmd"
          @(
            '@echo off',
            "call `"$vsPath\VC\Auxiliary\Build\vcvars64.bat`" || exit /b 1",
            "cd /d `"$source`" || exit /b 1",
            "perl Configure VC-WIN64A shared no-tests --prefix=`"$prefix`" --openssldir=`"$prefix\ssl`" || exit /b 1",
            'nmake || exit /b 1',
            'nmake install_sw install_ssldirs || exit /b 1'
          ) | Set-Content -Path $batchFile -Encoding ascii
          & cmd.exe /d /c $batchFile
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL build failed with exit code $LASTEXITCODE" }
          & "$prefix\bin\openssl.exe" version

      - name: Configure PJSIP features
        shell: pwsh
        run: |
          $configPath = Join-Path '${{ github.workspace }}' 'third_path/pjproject/pjlib/include/pj/config_site.h'
          @'
          #define PJSUA_MAX_CALLS          32
          #define PJSUA_MAX_ACC            16
          #define PJMEDIA_SOUND_CLOCK_RATE 44100
          #define PJMEDIA_HAS_VIDEO        0
          #define PJ_LOG_MAX_LEVEL         3
          #define PJ_IOQUEUE_MAX_HANDLERS  256
          '@ | Set-Content -Path $configPath -Encoding ascii

      - name: Configure unified DLL
        shell: pwsh
        run: |
          cmake `
            -S '${{ github.workspace }}/tool/windows_pjsip' `
            -B '${{ github.workspace }}/build/windows-pjsip' `
            -G 'Visual Studio 17 2022' `
            -A x64 `
            -DPJPROJECT_ROOT='${{ github.workspace }}/third_path/pjproject' `
            -DOPENSSL_ROOT_DIR='${{ github.workspace }}/deps/openssl' `
            -DOPENSSL_USE_STATIC_LIBS=FALSE `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL

      - name: Build Release DLL
        shell: pwsh
        run: |
          cmake --build '${{ github.workspace }}/build/windows-pjsip' `
            --config Release `
            --target pjsip_ffi `
            --parallel

      - name: Verify exports and prepare artifact
        shell: pwsh
        run: |
          $buildRoot = '${{ github.workspace }}/build/windows-pjsip'
          $output = '${{ github.workspace }}/output/windows-x64'
          $pjRoot = '${{ github.workspace }}/third_path/pjproject'
          New-Item -ItemType Directory -Force -Path "$output/bin", "$output/lib", "$output/include" | Out-Null

          $dll = Get-ChildItem -Path $buildRoot -Filter pjsip.dll -Recurse |
            Where-Object { $_.FullName -match '[\\/]Release[\\/]' } |
            Select-Object -First 1
          if (!$dll) { throw 'pjsip.dll was not generated' }
          # The PJSIP source also produces a static pjsip.lib. Select the import
          # library adjacent to our wrapper DLL, not the unrelated static file.
          $importLibPath = Join-Path $dll.DirectoryName 'pjsip.lib'
          if (!(Test-Path $importLibPath)) { throw 'Wrapper import library was not generated' }

          Copy-Item $dll.FullName "$output/bin/pjsip.dll"
          Copy-Item $importLibPath "$output/lib/pjsip.lib"

          # setup-msbuild 只保证 MSBuild 可用，不保证 dumpbin 在后续步骤的
          # PATH 中。根据 VS 2022 当前安装的 MSVC 版本定位对应的 x64 工具。
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere `
            -latest `
            -version '[17.0,18.0)' `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (!$vsPath) { throw 'Unable to locate Visual Studio 2022' }

          $toolVersionFile = Join-Path $vsPath 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt'
          if (!(Test-Path $toolVersionFile)) { throw 'Unable to determine the installed MSVC tool version' }
          $toolVersion = (Get-Content $toolVersionFile -Raw).Trim()
          $dumpbin = Join-Path $vsPath "VC\Tools\MSVC\$toolVersion\bin\Hostx64\x64\dumpbin.exe"
          if (!(Test-Path $dumpbin)) { throw "dumpbin.exe was not found at $dumpbin" }

          $exports = & $dumpbin /nologo /exports $dll.FullName
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed with exit code $LASTEXITCODE" }
          $defFile = '${{ github.workspace }}/tool/windows_pjsip/pjsip_ffi.def'
          $requiredSymbols = Get-Content $defFile |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -and $_ -ne 'EXPORTS' -and $_ -notmatch '^LIBRARY' }
          foreach ($symbol in $requiredSymbols) {
            if (!($exports -match "\b$symbol\b")) { throw "Missing DLL export: $symbol" }
          }
          $exports | Set-Content "$output/exports.txt"

          # PJSIP uses SChannel for SIP TLS, but bundled SRTP links against the
          # pinned OpenSSL libcrypto build above. Never copy an arbitrary DLL
          # from the mutable runner image.
          $dependents = & $dumpbin /nologo /dependents $dll.FullName
          if ($LASTEXITCODE -ne 0) { throw "dumpbin /dependents failed with exit code $LASTEXITCODE" }
          $openSslDlls = @($dependents |
            Select-String -Pattern '^\s*(lib(?:crypto|ssl)[^\s]*\.dll)\s*$' |
            ForEach-Object { $_.Matches[0].Groups[1].Value } |
            Sort-Object -Unique)

          foreach ($dllName in $openSslDlls) {
            $dependency = Get-Item `
              "${{ github.workspace }}/deps/openssl/bin/$dllName" `
              -ErrorAction SilentlyContinue
            if (!$dependency) {
              throw "Required runtime dependency $dllName was not found; refusing to publish an incomplete package"
            }
            Copy-Item $dependency.FullName (Join-Path "$output/bin" $dllName)
          }

          # Verify that every OpenSSL DLL named by pjsip.dll is now in the
          # application-local bin directory.
          foreach ($dllName in $openSslDlls) {
            if (!(Test-Path (Join-Path "$output/bin" $dllName))) {
              throw "Runtime package is missing $dllName"
            }
          }
          $dependents | Set-Content "$output/dependencies.txt"

          foreach ($dir in @('pjlib', 'pjlib-util', 'pjnath', 'pjmedia', 'pjsip')) {
            Copy-Item "$pjRoot/$dir/include/*" "$output/include" -Recurse -Force
          }
          Copy-Item "$pjRoot/COPYING" "$output/COPYING-pjproject.txt"
          Copy-Item "${{ github.workspace }}/openssl-$env:OPENSSL_VERSION/LICENSE.txt" `
            "$output/LICENSE-OpenSSL.txt"
          @"
          PJSIP 2.17-dev Windows x64
          Runtime: MSVC /MD
          TLS: Windows SChannel
          Media: audio only, G.711 enabled, bundled SRTP
          Runtime files: bin/pjsip.dll and bin/libcrypto-3-x64.dll
          OpenSSL: $env:OPENSSL_VERSION LTS, bundled app-locally in bin/
          "@ | Set-Content "$output/BUILD-INFO.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pjsip-windows-x64
          path: output/windows-x64/
          if-no-files-found: error
