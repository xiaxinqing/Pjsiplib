name: Build PJSIP macOS Universal Lib

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-pjsip-macos.yml"
      - "third_path/pjproject/**"
      - "tool/pjsip_bridge/**"
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools
        run: |
          brew install automake libtool nasm opus

      - name: Build Universal PJSIP
        run: |
          set -e
          
          # 基础配置
          MIN_MACOS_VERSION="10.13"
          PJ_ROOT="${GITHUB_WORKSPACE}/third_path/pjproject"
          OUTPUT_DIR="${GITHUB_WORKSPACE}/output"
          OPENSSL_VERSION="3.0.13"
          OPUS_VERSION="1.4"
          
          mkdir -p ${OUTPUT_DIR}/include
          mkdir -p ${OUTPUT_DIR}/lib
          mkdir -p ${GITHUB_WORKSPACE}/deps/src

          # --- 1. 编译 Universal Opus ---
          echo "Building Universal Opus..."
          cd ${GITHUB_WORKSPACE}/deps/src
          curl -LO https://downloads.xiph.org/releases/opus/opus-${OPUS_VERSION}.tar.gz
          tar -xzf opus-${OPUS_VERSION}.tar.gz
          
          build_opus() {
            local arch=$1
            local host=$2
            echo "Building Opus for $arch..."
            cp -R opus-${OPUS_VERSION} opus-$arch
            cd opus-$arch
            ./configure --host=$host --prefix=${GITHUB_WORKSPACE}/deps/$arch --disable-shared --enable-static \
                        CFLAGS="-arch $arch -mmacosx-version-min=${MIN_MACOS_VERSION}"
            make -j$(sysctl -n hw.ncpu) > /dev/null
            make install > /dev/null
            cd ..
          }
          build_opus "x86_64" "x86_64-apple-darwin"
          build_opus "arm64" "aarch64-apple-darwin"

          # --- 2. 编译 Universal OpenSSL ---
          echo "Building Universal OpenSSL..."
          cd ${GITHUB_WORKSPACE}/deps/src
          curl -LO https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz
          tar -xzf openssl-${OPENSSL_VERSION}.tar.gz
          
          build_openssl() {
            local arch=$1
            local target=$2
            echo "Building OpenSSL for $arch..."
            cp -R openssl-${OPENSSL_VERSION} openssl-$arch
            cd openssl-$arch
            ./Configure $target no-shared --prefix=${GITHUB_WORKSPACE}/deps/$arch -mmacosx-version-min=${MIN_MACOS_VERSION}
            make -j$(sysctl -n hw.ncpu) > /dev/null
            make install_sw > /dev/null
            cd ..
          }
          build_openssl "x86_64" "darwin64-x86_64-cc"
          build_openssl "arm64" "darwin64-arm64-cc"

          # --- 3. 配置 PJSIP config_site.h ---        echo "Configuring PJSIP..."
          #          cat > "${PJ_ROOT}/pjlib/include/pj/config_site.h" << 'EOF'
          #          #define PJSUA_MAX_CALLS                 32
          #          #define PJSUA_MAX_ACC                   16
          #          #define PJMEDIA_SOUND_CLOCK_RATE        44100
          #          #define PJMEDIA_HAS_WEBRTC_AEC          1
          #          #define PJMEDIA_HAS_OPUS_CODEC          1
          #          #define PJMEDIA_HAS_SRTP                1
          #          #define PJMEDIA_SRTP_HAS_DTLS           1
          #          #define PJ_HAS_SSL_SOCK                 1
          #          #define PJ_HAS_IPV6                     1
          #          #define PJMEDIA_HAS_VIDEO               0
          #          #define PJ_LOG_MAX_LEVEL                6
          #          #define PJ_IOQUEUE_MAX_HANDLERS         256
          #          EOF
          #          sed -i '' 's/#define DTLS_DEBUG  0/#define DTLS_DEBUG  1/' "${PJ_ROOT}/pjmedia/src/pjmedia/transport_srtp_dtls.c"
  

          # --- 4. 编译 PJSIP 各架构 ---
          build_pjsip() {
            local arch=$1
            local host=$2
            echo "Building PJSIP for $arch..."
            cd ${PJ_ROOT}
            make distclean || true
            
            export CFLAGS="-O2 -arch $arch -mmacosx-version-min=${MIN_MACOS_VERSION} -I${GITHUB_WORKSPACE}/deps/$arch/include"
            export LDFLAGS="-arch $arch -mmacosx-version-min=${MIN_MACOS_VERSION} -L${GITHUB_WORKSPACE}/deps/$arch/lib"
            
            ./configure --host=$host \
                        --with-ssl=${GITHUB_WORKSPACE}/deps/$arch \
                        --with-external-opus \
                        --enable-shared \
                        --disable-video --disable-sdl --disable-ffmpeg --with-webrtc
            
            # 注入依赖路径给 configure 识别
            sed -i '' "s|-lopus|-L${GITHUB_WORKSPACE}/deps/$arch/lib -lopus|g" Makefile || true
            
            make dep -j$(sysctl -n hw.ncpu) > /dev/null
            make lib -j$(sysctl -n hw.ncpu) > /dev/null
            
            # 聚合静态库到单个 dylib
            # 使用 -Wl,-all_load 强制链接所有静态库中的符号
            # 过滤掉已知的重复库（例如 libpjsdp 已经包含在 libpjmedia 中）
            local all_static_libs=$(find . -name "*.a" | grep -v "libpjsdp")
            local bridge_obj="${OUTPUT_DIR}/lib/vphone_pjsip_bridge_$arch.o"

            # VPhone 自己的轻量 wrapper：
            # 只在 PJSIP 同步回调里复制最后一次 SIP transaction 状态码，
            # 不保存 pjsip_transaction / pjsip_event 指针，避免 Dart 异步读取
            # 已释放指针导致 EXC_BAD_ACCESS。
            clang -c "${GITHUB_WORKSPACE}/tool/pjsip_bridge/vphone_pjsip_bridge.c" \
                -o "${bridge_obj}" \
                -arch $arch -mmacosx-version-min=${MIN_MACOS_VERSION} \
                -DPJ_AUTOCONF=1 \
                -DPJ_IS_BIG_ENDIAN=0 \
                -DPJ_IS_LITTLE_ENDIAN=1 \
                -I"${GITHUB_WORKSPACE}/tool/pjsip_bridge" \
                -I"${PJ_ROOT}/pjlib/include" \
                -I"${PJ_ROOT}/pjlib-util/include" \
                -I"${PJ_ROOT}/pjnath/include" \
                -I"${PJ_ROOT}/pjmedia/include" \
                -I"${PJ_ROOT}/pjsip/include" \
                -I"${GITHUB_WORKSPACE}/deps/$arch/include"
            
            echo "Linking dylib for $arch..."
            clang -shared -o "${OUTPUT_DIR}/lib/libpjsip_$arch.dylib" \
                -arch $arch -mmacosx-version-min=${MIN_MACOS_VERSION} \
                -framework AudioToolbox -framework AVFoundation -framework CoreAudio -framework CoreMedia -framework Security -framework Foundation -framework AppKit \
                -lc++ -lobjc \
                "${bridge_obj}" \
                -Wl,-all_load \
                ${all_static_libs} \
                "${GITHUB_WORKSPACE}/deps/$arch/lib/libssl.a" \
                "${GITHUB_WORKSPACE}/deps/$arch/lib/libcrypto.a" \
                "${GITHUB_WORKSPACE}/deps/$arch/lib/libopus.a"
            
            # 验证符号
            nm -gU "${OUTPUT_DIR}/lib/libpjsip_$arch.dylib" | grep -q "pjsua_create" || (echo "Verification failed: pjsua_create missing" && exit 1)
            nm -gU "${OUTPUT_DIR}/lib/libpjsip_$arch.dylib" | grep -q "pjmedia_transport_srtp_dtls_get_fingerprint" || (echo "Verification failed: DTLS-SRTP symbol missing" && exit 1)
            nm -gU "${OUTPUT_DIR}/lib/libpjsip_$arch.dylib" | grep -q "vphone_get_call_info_snapshot" || (echo "Verification failed: VPhone call snapshot symbol missing" && exit 1)
          }

          build_pjsip "x86_64" "x86_64-apple-darwin"
          build_pjsip "arm64" "aarch64-apple-darwin"

          # --- 4. 合并为 Universal Binary ---
          echo "Creating Universal Binary..."
          lipo -create "${OUTPUT_DIR}/lib/libpjsip_x86_64.dylib" "${OUTPUT_DIR}/lib/libpjsip_arm64.dylib" -output "${OUTPUT_DIR}/lib/libpjsip.dylib"
          
          # 修改 rpath
          install_name_tool -id "@rpath/libpjsip.dylib" "${OUTPUT_DIR}/lib/libpjsip.dylib"
          
          # 整理头文件
          cd ${PJ_ROOT}
          for dir in pjlib pjlib-util pjnath pjmedia pjsip; do
              cp -R "${dir}/include/" "${OUTPUT_DIR}/include/"
          done
          
          # 清理临时文件
          rm "${OUTPUT_DIR}/lib/libpjsip_x86_64.dylib" "${OUTPUT_DIR}/lib/libpjsip_arm64.dylib"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pjsip-macos-universal
          path: output/
